# AutoHeal DevOps — Enterprise OpenTelemetry Collector Configuration
# Receives distributed traces and application metrics, sanitizes sensitive attributes,
# and exports to telemetry backends.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'autoheal-backend'
          scrape_interval: 15s
          static_configs:
            - targets: ['backend:8000']
          metrics_path: '/api/v1/observability/metrics'

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    send_batch_size: 1024
    timeout: 5s

  # Redaction processor to scrub any sensitive token or password attributes
  attributes:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: token
        value: "[REDACTED]"
        action: upsert
      - key: password
        value: "[REDACTED]"
        action: upsert
      - key: client_secret
        value: "[REDACTED]"
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: autoheal

  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
