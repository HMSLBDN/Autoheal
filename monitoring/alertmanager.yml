# ==============================================================================
# AutoHeal DevOps — Alertmanager Configuration
# Routes active alerts to the AutoHeal Ingestion Webhook with HMAC signature
# ==============================================================================
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "environment"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: "autoheal-webhook"

receivers:
  - name: "autoheal-webhook"
    webhook_configs:
      - url: "http://autoheal-api:8000/api/v1/alerts/webhook"
        send_resolved: true
        http_config:
          bearer_token: "autoheal_dev_alertmanager_webhook_secret_32chars"
        max_alerts: 10
