# ==============================================================================
# AutoHeal DevOps — Prometheus Server Configuration
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      scheme: http
      timeout: 10s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. AutoHeal DevOps API Metrics
  - job_name: "autoheal-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["autoheal-api:8000"]

  # 3. Monitored Microservices
  - job_name: "checkout-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["checkout-api:8080"]
    relabel_configs:
      - target_label: service
        replacement: "checkout-api"
      - target_label: environment
        replacement: "production"

  - job_name: "customer-web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["customer-web:8081"]
    relabel_configs:
      - target_label: service
        replacement: "customer-web"
      - target_label: environment
        replacement: "staging"

  - job_name: "payments-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payments-api:8082"]
    relabel_configs:
      - target_label: service
        replacement: "payments-api"
      - target_label: environment
        replacement: "production"

  # 4. Host Node Metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # 5. Container Resource Metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
