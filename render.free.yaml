# ==============================================================================
# AutoHeal DevOps — Render Free-Tier Blueprint Specification
# ==============================================================================
# Cost: $0 / month (100% Free Tier)
#
# Services included:
#   1. autoheal-backend: FastAPI Web Service (plan: free)
#   2. autoheal-redis: Render Key Value / Redis (plan: free)
#   3. autoheal-db: PostgreSQL 16 Database (plan: free)
#
# Services excluded from free tier:
#   - autoheal-celery-worker (Render requires 'plan: starter' for background workers)
#   - autoheal-celery-beat (Render requires 'plan: starter' for background workers)
#
# Operational characteristics:
#   - The FastAPI backend serves authentication, dashboard queries, incidents,
#     database migrations, and metrics completely independently.
#   - Free Web Services spin down after 15 minutes of inactivity; initial cold
#     start takes ~30-50 seconds when receiving a request from Vercel.
#   - Free PostgreSQL databases provide 1 GB storage and expire after 30 days
#     unless upgraded.
# ==============================================================================

services:
  # ==============================================================================
  # 1. FastAPI Web API Server (Free Tier)
  # ==============================================================================
  - type: web
    name: autoheal-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://autoheal-omega.vercel.app,https://autoheal-devops.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: autoheal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: autoheal-redis
          property: connectionString
      - key: ALERTMANAGER_HMAC_SECRET
        generateValue: true
      - key: RECOVERY_SIMULATION_MODE
        value: "true"
      - key: RESTRICTED_DOCKER_AGENT_ENABLED
        value: "false"

  # ==============================================================================
  # 2. Redis Key Value Cache (Free Tier)
  # ==============================================================================
  - type: redis
    name: autoheal-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  # ==============================================================================
  # 3. PostgreSQL 16 Database (Free Tier)
  # ==============================================================================
  - name: autoheal-db
    databaseName: autoheal_db
    user: autoheal_user
    plan: free
    ipAllowList: []
