worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 128;
}

http {
    # Non-root temporary directories
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Upstream Docker daemon UNIX socket
    upstream docker_daemon {
        server unix:/var/run/docker.sock;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        server_name autoheal_socket_proxy;

        # TLS Server Identity
        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;

        # Mutual TLS (mTLS) Client Identity Verification
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        # Default Deny: All unmatched routes return 403 Forbidden
        location / {
            return 403 '{"error": "Forbidden: endpoint not permitted by security proxy"}';
        }

        # ----------------------------------------------------------------------
        # Endpoint 1: Inspect Container
        # Matches: /containers/autoheal_test_service/json
        #      or: /v1.X/containers/autoheal_test_service/json
        # ----------------------------------------------------------------------
        location ~ ^/(v[0-9]+\.[0-9]+/)?containers/autoheal_test_service/json$ {
            # 1. mTLS Client Certificate Validation against CA
            if ($ssl_client_verify != SUCCESS) {
                return 403 '{"error": "Forbidden: invalid or missing client certificate"}';
            }

            # 2. Strict Exact Subject Identity Match
            # Rejects: CN=autoheal_docker_agent_evil, CN=autoheal_docker_agent.attacker.com, etc.
            if ($ssl_client_s_dn !~ "^CN=autoheal_docker_agent$") {
                return 403 '{"error": "Forbidden: unauthorized client certificate identity"}';
            }

            # 3. HTTP Verb Restriction: GET only
            if ($request_method !~ ^(GET)$) {
                return 405 '{"error": "Method Not Allowed: only GET permitted for inspect"}';
            }

            # 4. Query String Restriction: No query arguments allowed on inspect
            if ($args != "") {
                return 400 '{"error": "Bad Request: query parameters not permitted on inspect"}';
            }

            proxy_pass http://docker_daemon;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # ----------------------------------------------------------------------
        # Endpoint 2: Restart Container
        # Matches: /containers/autoheal_test_service/restart
        #      or: /v1.X/containers/autoheal_test_service/restart
        # ----------------------------------------------------------------------
        location ~ ^/(v[0-9]+\.[0-9]+/)?containers/autoheal_test_service/restart$ {
            # 1. mTLS Client Certificate Validation against CA
            if ($ssl_client_verify != SUCCESS) {
                return 403 '{"error": "Forbidden: invalid or missing client certificate"}';
            }

            # 2. Strict Exact Subject Identity Match
            if ($ssl_client_s_dn !~ "^CN=autoheal_docker_agent$") {
                return 403 '{"error": "Forbidden: unauthorized client certificate identity"}';
            }

            # 3. HTTP Verb Restriction: POST only
            if ($request_method !~ ^(POST)$) {
                return 405 '{"error": "Method Not Allowed: only POST permitted for restart"}';
            }

            # 4. Strict Query String Validation: empty or t=[0-9]{1,2} (quoted regex)
            if ($args !~ "^(t=[0-9]{1,2})?$") {
                return 400 '{"error": "Bad Request: invalid query parameters for restart"}';
            }

            proxy_pass http://docker_daemon;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
