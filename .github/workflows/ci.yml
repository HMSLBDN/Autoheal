name: AutoHeal DevOps CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Verification & Pytest Suite
  # ============================================================================
  backend-quality:
    name: Backend Lint, Syntax & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/app backend/tests backend/scripts

      - name: Verify Alembic migration environment
        run: |
          cd backend
          python -c "from alembic.config import Config; from alembic import command; cfg = Config('alembic.ini'); print('Alembic configuration loaded cleanly.')"

      - name: Run Pytest test suite
        env:
          ENVIRONMENT: "test"
          SECRET_KEY: "test_secret_key_minimum_32_characters_long_12345"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests -v --durations=10

  # ============================================================================
  # 2. Frontend Verification & Production Build
  # ============================================================================
  frontend-quality:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: |
          pnpm exec tsc --noEmit

      - name: Run ESLint validation
        run: |
          pnpm exec eslint .

      - name: Run Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: |
          pnpm run build

  # ============================================================================
  # 3. Dockerfile & Docker Compose Validation
  # ============================================================================
  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose (Production)
        run: |
          docker compose -f docker-compose.yml config

      - name: Validate Docker Compose (Development)
        run: |
          docker compose -f docker-compose.dev.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: autoheal-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: autoheal-frontend:ci-test

  # ============================================================================
  # 4. Security Audit & Secret Detection
  # ============================================================================
  security-audit:
    name: Security Scan & Git Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no .env or private key files committed
        run: |
          echo "Checking repository for prohibited secret files..."
          FOUND_SECRETS=0
          for file in $(git ls-files | grep -E '\.env($|\.)|\.pem$|\.key$|id_rsa'); do
            case "$file" in
              *.example|.env.example|*/.env.example)
                continue
                ;;
              *)
                echo "SECURITY ERROR: Forbidden sensitive file committed: $file"
                FOUND_SECRETS=1
                ;;
            esac
          done
          if [ $FOUND_SECRETS -eq 1 ]; then
            exit 1
          fi
          echo "No forbidden credentials or secrets detected in repository."
